[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.85"
authors = ["Notch contributors"]
license = "MIT"
repository = "https://github.com/Brick-Bread/WNotch"
publish = false

[workspace.dependencies]
notch-core = { path = "crates/notch-core" }
notch-ipc = { path = "crates/notch-ipc" }
notch-platform = { path = "crates/notch-platform" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2.12.5"
tauri-build = "2.7.4"
thiserror = "2.0.21"
windows = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
