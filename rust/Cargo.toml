[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.21.0"
edition = "2024"
rust-version = "1.85"
authors = ["Notch contributors"]
license = "MIT"
repository = "https://github.com/Brick-Bread/WNotch"
publish = false

[workspace.dependencies]
notch-core = { path = "crates/notch-core" }
notch-ipc = { path = "crates/notch-ipc" }
notch-platform = { path = "crates/notch-platform" }

base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
getrandom = "0.4.3"
indexmap = "2.14.2"
p256 = { version = "0.14.0", default-features = false, features = ["alloc", "ecdsa", "pkcs8"] }
rrule = "0.14.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "raw_value"] }
sha2 = "0.11.1"
tauri = "2.12.5"
tauri-build = "2.7.4"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = "1.54.1"
windows = "0.62.2"
windows-collections = "0.3.2"
windows-core = "0.62.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
codegen-units = 1
lto = true
strip = true
