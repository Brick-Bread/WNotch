[package]
name = "notch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A notch for your desktop: activities, glow and a built-in terminal"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ureq = "2"
notch-core = { path = "../crates/notch-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
interprocess = "2"
base64 = "0.22"
log = "0.4"
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
drag = "2"
opener = { version = "0.8", default-features = false }
png = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
sha2 = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Performance", "Win32_System_Power", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Foundation", "Media_Control", "Storage_Streams", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com_StructuredStorage", "Win32_Graphics_Dwm", "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_UI_Shell_Common", "Devices_Bluetooth", "Devices_Enumeration", "Foundation_Collections", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Power", "Win32_System_Rpc", "Win32_System_Variant", "Win32_System_Wmi", "Win32_UI_Input_KeyboardAndMouse"] }
windows-collections = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
md-5 = "0.10"
zbus = "5"
ureq = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
