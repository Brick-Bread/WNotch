name: release

# Pushing a tag like v0.9.0 builds the Windows installer, the Linux AppImage and the .deb and
# publishes them as a GitHub release. Installed copies update themselves from these files:
# the names below are what the updater looks for, so do not change them.
# Running it by hand builds the packages only and keeps them as workflow artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "v$crate" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match the version $crate in Cargo.toml"; exit 1; }
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace --release

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the packages
        env:
          NO_STRIP: "true"
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Name the packages
        run: |
          version='${{ steps.version.outputs.version }}'
          mkdir release
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/bundle/nsis/*.exe "release/Notch-Setup-$version.exe"
          else
            cp target/release/bundle/appimage/*.AppImage "release/Notch-$version-x86_64.AppImage"
            cp target/release/bundle/deb/*.deb "release/Notch-$version-amd64.deb"
          fi
          ls -l release

      - uses: actions/upload-artifact@v4
        with:
          name: Notch-${{ runner.os }}
          path: release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      # GitHub also lists a SHA-256 digest for every uploaded file; the updater checks downloads
      # against that one. This file is for people who download by hand.
      - name: Write the checksums
        working-directory: release
        run: sha256sum Notch-* | tee SHA256SUMS.txt

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --title "Notch ${GITHUB_REF_NAME#v}" --generate-notes
