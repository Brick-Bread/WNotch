name: release

# Pushing a tag like v0.1.0 builds the installer and publishes a GitHub release.
# Running it by hand builds the installer only and keeps it as a workflow artifact.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { "0.0.0-dev.$env:GITHUB_RUN_NUMBER" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Test
        run: dotnet test Notch.slnx -c Release

      # Publishes the app self-contained and appends it to the setup program; see installer/build.ps1.
      # With CODESIGN_PFX_BASE64 and CODESIGN_PFX_PASSWORD set as secrets, Notch's own programs are signed.
      - name: Build the installer
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: ./installer/build.ps1 -Version ${{ steps.version.outputs.version }}

      # The app only runs an update whose installer has a valid signature from this key
      # (UpdateSigning.PublicKey). Without the UPDATE_SIGNING_KEY secret no .sig is made.
      - name: Sign the installer for the updater
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: ./installer/sign-update.ps1 -File (Get-Item artifacts/Notch-Setup-*.exe).FullName

      # The one .zip on the release: what "Brick-Bread/WNotch" installs from the app's plugin settings.
      - name: Package the sample plugin
        shell: pwsh
        run: |
          dotnet publish samples/BreakReminder -c Release -o artifacts/break-reminder
          Remove-Item artifacts/break-reminder/*.pdb -ErrorAction SilentlyContinue
          Compress-Archive -Path artifacts/break-reminder/* -DestinationPath artifacts/BreakReminder-plugin.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Notch-Setup-${{ steps.version.outputs.version }}
          path: |
            artifacts/Notch-Setup-*.exe
            artifacts/Notch-Setup-*.exe.sig
          if-no-files-found: error

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $installer = Get-Item artifacts/Notch-Setup-*.exe
          # The app updates from its own copy of the installer, so the download count on the site
          # (Notch-Setup-*.exe only) is people choosing to download, not updates. Same bytes, so
          # the signature carries over.
          $update = Join-Path artifacts ($installer.Name -replace '^Notch-Setup-', 'Notch-Update-')
          Copy-Item $installer.FullName $update
          $updateFiles = @((Resolve-Path $update).Path)
          if (Test-Path "$($installer.FullName).sig") {
              Copy-Item "$($installer.FullName).sig" "$update.sig"
              $updateFiles += (Resolve-Path "$update.sig").Path
          }
          # The signature, when there is one, goes on the same release: the app looks for <installer>.sig.
          $signatures = @(Get-ChildItem artifacts/Notch-Setup-*.exe.sig -ErrorAction SilentlyContinue | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME $installer.FullName @signatures @updateFiles artifacts/BreakReminder-plugin.zip --title "Notch ${{ steps.version.outputs.version }}" --generate-notes
