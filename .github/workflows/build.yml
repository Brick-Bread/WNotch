name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Notch.slnx -c Release -p:ContinuousIntegrationBuild=true
      - run: dotnet test Notch.slnx -c Release --no-build
