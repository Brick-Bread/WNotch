name: build

# Tests and lints the Rust workspace on both platforms and builds the installers, which are kept
# as workflow artifacts so a broken package is noticed before a release is.
on:
  push:
    branches: [main, rust]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # The oldest runner that has WebKitGTK 4.1, so the AppImage runs on as many distributions as possible.
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev libpulse-dev libdbus-1-dev libudev-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install the Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build the packages
        env:
          # linuxdeploy's bundled strip cannot read the newer ELF sections of current toolchains.
          NO_STRIP: "true"
        run: cargo tauri build --ci --bundles ${{ matrix.bundles }}

      - name: Keep the Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Notch-Windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Keep the Linux packages
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: Notch-Linux
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

  ui-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: npm test --prefix tests
