name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build Notch.slnx -c Release -p:ContinuousIntegrationBuild=true
      - run: dotnet test Notch.slnx -c Release --no-build
      # Catches a broken installer before a release does; the file is kept for download.
      - name: Build the installer
        shell: pwsh
        run: ./installer/build.ps1 -Version 0.0.0-ci.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: Notch-Setup
          path: artifacts/Notch-Setup-*.exe
          if-no-files-found: error
